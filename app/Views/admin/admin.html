<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-5xl mx-auto">
        
        <!-- Header -->
        <h1 class="text-3xl font-bold mb-6 animate-fade-in-down">🛠️ Admin Dashboard</h1>

        <!-- Platform Statistics -->
        <h2 class="text-xl font-semibold mt-6 animate-fade-in-down">📊 Platform Statistics</h2>
        <div class="bg-white p-6 shadow-md rounded-lg mt-3 animate-fade-in-up">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-blue-50 p-4 rounded-lg text-center hover:scale-105 transition-transform">
                    <p class="text-gray-600">Total Users</p>
                    <p class="text-2xl font-bold text-blue-600" id="totalUsers">0</p>
                </div>
                <div class="bg-green-50 p-4 rounded-lg text-center hover:scale-105 transition-transform">
                    <p class="text-gray-600">Total Doctors</p>
                    <p class="text-2xl font-bold text-green-600" id="totalDoctors">0</p>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg text-center hover:scale-105 transition-transform">
                    <p class="text-gray-600">Total Patients</p>
                    <p class="text-2xl font-bold text-purple-600" id="totalPatients">0</p>
                </div>
                <div class="bg-red-50 p-4 rounded-lg text-center hover:scale-105 transition-transform">
                    <p class="text-gray-600">Total Appointments</p>
                    <p class="text-2xl font-bold text-red-600" id="totalAppointments">0</p>
                </div>
            </div>
        </div>

        <!-- Manage Users -->
        <h2 class="text-xl font-semibold mt-6 animate-fade-in-down">👥 Manage Users</h2>
        <input type="text" id="searchUser" placeholder="Search by name or email..." class="w-full border p-2 my-2 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all animate-fade-in-up">

        <div class="bg-white shadow-md rounded-lg mt-3 overflow-hidden animate-fade-in-up">
            <table class="w-full">
                <thead>
                    <tr class="bg-blue-500 text-white">
                        <th class="py-3 px-4">ID</th>
                        <th class="py-3 px-4">Name</th>
                        <th class="py-3 px-4">Email</th>
                        <th class="py-3 px-4">Role</th>
                        <th class="py-3 px-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="userList" class="divide-y divide-gray-200">
                    <tr><td colspan="5" class="py-4 text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- All Appointments -->
        <h2 class="text-xl font-semibold mt-6 animate-fade-in-down">📅 All Appointments</h2>
        <div class="bg-white shadow-md rounded-lg mt-3 overflow-hidden animate-fade-in-up">
            <table class="w-full">
                <thead>
                    <tr class="bg-blue-500 text-white">
                        <th class="py-3 px-4">ID</th>
                        <th class="py-3 px-4">Patient</th>
                        <th class="py-3 px-4">Doctor</th>
                        <th class="py-3 px-4">Date</th>
                        <th class="py-3 px-4">Time</th>
                        <th class="py-3 px-4">Status</th>
                        <th class="py-3 px-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="appointmentsList" class="divide-y divide-gray-200">
                    <tr><td colspan="7" class="py-4 text-center">Loading appointments...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Custom Animations -->
    <style>
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.5s ease-out;
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadStatistics();
            loadUsers();
            loadAppointments();
        });

        // Load platform statistics
        function loadStatistics() {
            fetch("/admin/stats")
            .then(response => response.json())
            .then(data => {
                document.getElementById("totalUsers").innerText = data.total_users || 0;
                document.getElementById("totalDoctors").innerText = data.total_doctors || 0;
                document.getElementById("totalPatients").innerText = data.total_patients || 0;
                document.getElementById("totalAppointments").innerText = data.total_appointments || 0;
            });
        }

        // Load users
        function loadUsers(query = "") {
            fetch(`/admin/users?q=${query}`)
            .then(response => response.json())
            .then(data => {
                let html = "";
                data.results.forEach(user => {
                    html += `<tr class="hover:bg-gray-50 transition-all">
                                <td class="py-3 px-4">${user.id}</td>
                                <td class="py-3 px-4">${user.first_name} ${user.last_name}</td>
                                <td class="py-3 px-4">${user.email}</td>
                                <td class="py-3 px-4">${user.role}</td>
                                <td class="py-3 px-4">
                                    ${user.role !== 'admin' ? `<button onclick="deleteUser(${user.id})" class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600 transition-all">Delete</button>` : ''}
                                </td>
                            </tr>`;
                });
                document.getElementById("userList").innerHTML = html;
            });
        }

        // Load appointments
        function loadAppointments() {
            fetch("/appointments")
            .then(response => response.json())
            .then(data => {
                let html = "";
                data.forEach(appointment => {
                    html += `
                    <tr class="hover:bg-gray-50 transition-all">
                        <td class="py-3 px-4">${appointment.appointment_id}</td>
                        <td class="py-3 px-4">${appointment.patient_first_name} ${appointment.patient_last_name}</td>
                        <td class="py-3 px-4">Dr. ${appointment.doctor_last_name}</td>
                        <td class="py-3 px-4">${new Date(appointment.appointment_date).toLocaleDateString()}</td>
                        <td class="py-3 px-4">${appointment.start_time} - ${appointment.end_time}</td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-1 rounded-full ${getStatusColor(appointment.status)}">
                                ${appointment.status}
                            </span>
                        </td>
                        <td class="py-3 px-4">
                            ${appointment.status !== 'cancelled' ? 
                                `<button onclick="cancelAppointment(${appointment.appointment_id})" 
                                 class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600 transition-all">
                                    Cancel
                                 </button>` : 
                                 'Cancelled'}
                        </td>
                    </tr>`;
                });
                document.getElementById("appointmentsList").innerHTML = html;
            });
        }

        // Helper function for status colors
        function getStatusColor(status) {
            switch(status.toLowerCase()) {
                case 'confirmed':
                    return 'bg-green-100 text-green-800';
                case 'pending':
                    return 'bg-yellow-100 text-yellow-800';
                case 'cancelled':
                    return 'bg-red-100 text-red-800';
                default:
                    return 'bg-gray-100 text-gray-800';
            }
        }

        // Delete user
        function deleteUser(id) {
            if (confirm("Are you sure you want to delete this user?")) {
                fetch("/admin/delete-user", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: id })
                })
                .then(() => loadUsers());
            }
        }

        // Cancel appointment
        function cancelAppointment(appointmentId) {
            if (confirm("Are you sure you want to cancel this appointment?")) {
                fetch("/admin/cancel-appointment", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ appointment_id: appointmentId , status: 'cancelled'})
                })
                .then(response => {
                    if (response.ok) {
                        loadAppointments();
                        alert("Appointment cancelled successfully!");
                    }
                });
            }
        }

        // Search users
        document.getElementById("searchUser").addEventListener("input", function () {
            loadUsers(this.value);
        });
    </script>
</body>
</html>
