<!DOCTYPE html>
<html lang="en">
<head>
    <title>Patient Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
        }

        .animate-slide-in {
            animation: slideIn 0.5s ease forwards;
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease;
        }

        .btn:hover:after {
            width: 200px;
            height: 200px;
        }

        .table-row {
            transition: background-color 0.3s ease;
        }

        .table-row:hover {
            background-color: rgba(249, 250, 251, 0.9);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .logout-btn {
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .logout-icon {
            transition: transform 0.3s ease;
        }

        .logout-btn:hover .logout-icon {
            transform: translateX(3px);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 p-6">
    <div class="max-w-4xl mx-auto space-y-8 animate-fade-in">
        <!-- Header -->
        <header class="card p-6 gradient-bg text-white">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-4xl font-bold flex items-center gap-3 mb-2">
                        <span class="animate-slide-in">👤</span>
                        <span class="animate-slide-in" style="animation-delay: 0.2s">Patient Dashboard</span>
                    </h1>
                    <p class="opacity-90 animate-slide-in" style="animation-delay: 0.3s">Manage your appointments and personal information</p>
                </div>
                <button onclick="handleLogout()" class="logout-btn flex items-center gap-2 px-4 py-2 rounded-lg border border-white/30 text-white">
                    <span>Logout</span>
                    <svg class="logout-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Appointments List -->
        <section class="card p-6">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <span>📅</span> Your Appointments
            </h2>
            <div class="overflow-hidden rounded-lg">
                <table class="w-full">
                    <thead>
                        <tr class="bg-blue-600 text-white">
                            <th class="py-3 px-4 text-left">Doctor</th>
                            <th class="py-3 px-4 text-left">Date</th>
                            <th class="py-3 px-4 text-left">Status</th>
                            <th class="py-3 px-4 text-left">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentList">
                        <tr><td colspan="4" class="py-4 text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Book Appointment -->
        <section class="card p-6">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <span>🗓️</span> Book an Appointment
            </h2>
            <form id="appointmentForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Doctor:</label>
                    <select name="doctor_id" id="doctorList" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                    </select>
                </div>

                <div id="availableDaysNotice" class="hidden text-sm text-gray-600 bg-blue-50 p-3 rounded-lg">
                    * Select a date from the available weekdays of the doctor's schedule.
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Choose Date:</label>
                    <input type="text" name="date" id="datePicker" placeholder="Select a date" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" disabled>
                </div>

                <button type="submit" class="btn w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-medium transition-all">
                    Book Appointment
                </button>
            </form>
        </section>

        <!-- Update Profile -->
        <section class="card p-6">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <span>📝</span> Update Personal Info
            </h2>
            <form id="updateProfileForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Insurance Number:</label>
                    <input type="text" name="insurance_number" id="insuranceInput" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                </div>

                <button type="submit" class="btn w-full bg-indigo-500 hover:bg-indigo-600 text-white py-3 rounded-lg font-medium transition-all">
                    Update Profile
                </button>
            </form>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadAppointments();
            loadDoctors();
            loadPatientInfo();
        });

        function loadAppointments() {
            fetch("/appointments")
                .then(response => response.json())
                .then(data => {
                    let html = "";
                    data.forEach((appointment, index) => {
                        html += `
                            <tr class="table-row" style="animation: slideIn 0.3s ease forwards ${index * 0.1}s;">
                                <td class="border-b border-gray-200 px-4 py-3">${appointment.doctor_first_name}</td>
                                <td class="border-b border-gray-200 px-4 py-3">${appointment.appointment_date}</td>
                                <td class="border-b border-gray-200 px-4 py-3">
                                    <span class="px-3 py-1 rounded-full text-sm ${getStatusColor(appointment.status)}">
                                        ${appointment.status}
                                    </span>
                                </td>
                                <td class="border-b border-gray-200 px-4 py-3">
                                    <button onclick="cancelAppointment(${appointment.appointment_id})" 
                                            class="btn bg-red-500 hover:bg-red-600 text-white px-4 py-1 rounded-lg transition-all">
                                        Cancel
                                    </button>
                                </td>
                            </tr>`;
                    });
                    document.getElementById("appointmentList").innerHTML = html || '<tr><td colspan="4" class="py-4 text-center text-gray-500">No appointments found</td></tr>';
                });
        }

        function getStatusColor(status) {
            const colors = {
                'Scheduled': 'bg-green-100 text-green-800',
                'Completed': 'bg-blue-100 text-blue-800',
                'Cancelled': 'bg-red-100 text-red-800',
                'Pending': 'bg-yellow-100 text-yellow-800'
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        }

        function loadDoctors() {
            fetch("/doctors/specialty")
                .then(response => response.json())
                .then(data => {
                    let html = "<option value='' disabled selected>Choose a Doctor</option>";
                    data.forEach(doctor => {
                        html += `<option value="${doctor.doctor_id}">${doctor.first_name} ${doctor.last_name} - ${doctor.specialty}</option>`;
                    });
                    const doctorList = document.getElementById("doctorList");
                    doctorList.innerHTML = html;
                    attachDoctorSelectHandler();
                });
        }

        function attachDoctorSelectHandler() {
            const doctorList = document.getElementById("doctorList");
            doctorList.addEventListener("change", function() {
                const doctorId = this.value;
                if (doctorId) {
                    fetch(`/doctor/${doctorId}/available-days`)
                        .then(response => response.json())
                        .then(data => {
                            if (data.available_days) {
                                displayAvailableWeekdays(data.available_days);
                            }
                        });
                }
            });
        }

        function displayAvailableWeekdays(availableDays) {
            const dayMapping = {
                "Sunday": 0, "Monday": 1, "Tuesday": 2, "Wednesday": 3,
                "Thursday": 4, "Friday": 5, "Saturday": 6
            };
            const allowedDays = availableDays.map(day => dayMapping[day]);
            const datePicker = document.getElementById("datePicker");
            datePicker.disabled = false;

            flatpickr(datePicker, {
                dateFormat: "Y-m-d",
                disable: [
                    function(date) {
                        return !allowedDays.includes(date.getDay());
                    }
                ],
                locale: { firstDayOfWeek: 1 }
            });

            document.getElementById("availableDaysNotice").classList.remove("hidden");
        }

        function cancelAppointment(id) {
            if (confirm('Are you sure you want to cancel this appointment?')) {
                fetch("/patient/cancel-appointment", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ appointment_id: id })
                })
                .then(() => {
                    loadAppointments();
                    showNotification('Appointment cancelled successfully');
                });
            }
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                const logoutBtn = document.querySelector('.logout-btn');
                const originalContent = logoutBtn.innerHTML;
                logoutBtn.innerHTML = '<span class="animate-spin">↻</span> Logging out...';
                logoutBtn.disabled = true;

                fetch('/logout', {
                    method: 'POST',
                    credentials: 'include'
                })
                .then(response => {
                    if (response.ok) {
                        showNotification('Logging out...');
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 1000);
                    } else {
                        throw new Error('Logout failed');
                    }
                })
                .catch(error => {
                    showNotification('Logout failed. Please try again.');
                    logoutBtn.innerHTML = originalContent;
                    logoutBtn.disabled = false;
                });
            }
        }

        function loadPatientInfo() {
            fetch("/patient/profile")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("insuranceInput").value = data.insurance_number || "";
                });
        }


        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg animate-fade-in';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => {
                notification.style.animation = 'fadeIn 0.5s ease reverse';
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }

        document.getElementById("updateProfileForm").addEventListener("submit", function(e) {
            e.preventDefault();
            let formData = new FormData(this);

            fetch("/patient/update-info", {
                method: "POST",
                body: formData
            })
            .then(() => {
                showNotification('Profile updated successfully');
            });
        });

        document.getElementById("appointmentForm").addEventListener("submit", function(e) {
            e.preventDefault();
            let formData = new FormData(this);

            fetch("/patient/book-appointment", {
                method: "POST",
                body: formData
            })
            .then(() => {
                loadAppointments();
                showNotification('Appointment booked successfully');
                this.reset();
            });
        });
    </script>
</body>
</html>
