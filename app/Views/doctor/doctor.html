<!DOCTYPE html>
<html lang="en">
<head>
    <title>Doctor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
        }

        .animate-slide-in {
            animation: slideIn 0.5s ease forwards;
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
        }

        .btn {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease;
        }

        .btn:hover:after {
            width: 200px;
            height: 200px;
        }

        .table-row {
            transition: all 0.3s ease;
        }

        .table-row:hover {
            background-color: rgba(249, 250, 251, 0.9);
        }

        .logout-btn {
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .logout-icon {
            transition: transform 0.3s ease;
        }

        .logout-btn:hover .logout-icon {
            transform: translateX(3px);
        }

        .stat-card {
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        input[type="date"], input[type="time"] {
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        input[type="date"]:focus, input[type="time"]:focus {
            border-color: #3b82f6;
            ring: 2px;
            ring-color: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-sky-50 p-6">
    <div class="max-w-5xl mx-auto space-y-8 animate-fade-in">
        <!-- Header -->
        <header class="card p-6 gradient-bg text-white">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-4xl font-bold flex items-center gap-3 mb-2">
                        <span class="animate-slide-in">🩺</span>
                        <span class="animate-slide-in" style="animation-delay: 0.2s">Doctor Dashboard</span>
                    </h1>
                    <p class="opacity-90 animate-slide-in" style="animation-delay: 0.3s">Manage your appointments and schedule</p>
                </div>
                <button onclick="handleLogout()" class="logout-btn flex items-center gap-2 px-4 py-2 rounded-lg border border-white/30 text-white">
                    <span>Logout</span>
                    <svg class="logout-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card p-6 stat-card bg-gradient-to-br from-blue-500 to-blue-600 text-white">
                <h3 class="text-lg opacity-80 mb-2">Total Appointments</h3>
                <p class="text-3xl font-bold" id="totalAppointments">0</p>
            </div>
            <div class="card p-6 stat-card bg-gradient-to-br from-green-500 to-green-600 text-white">
                <h3 class="text-lg opacity-80 mb-2">Total Revenue</h3>
                <p class="text-3xl font-bold">$<span id="totalRevenue">0</span></p>
            </div>
        </div>

        <!-- Appointments List -->
        <section class="card p-6">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <span>📅</span> Your Scheduled Appointments
            </h2>
            <div class="overflow-hidden rounded-lg">
                <table class="w-full">
                    <thead>
                        <tr class="bg-blue-600 text-white">
                            <th class="py-3 px-4 text-left">Patient</th>
                            <th class="py-3 px-4 text-left">Date</th>
                            <th class="py-3 px-4 text-left">Time</th>
                            <th class="py-3 px-4 text-left">Status</th>
                            <th class="py-3 px-4 text-left">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentList">
                        <tr><td colspan="5" class="py-4 text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Set Availability -->
        <section class="card p-6">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <span>⏰</span> Set Your Availability
            </h2>
            <form id="availabilityForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Date:</label>
                    <input type="date" name="date" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Start Time:</label>
                        <input type="time" name="start_time" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">End Time:</label>
                        <input type="time" name="end_time" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                    </div>
                </div>

                <button type="submit" class="btn w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-medium transition-all">
                    Update Availability
                </button>
            </form>
        </section>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadAppointments();
            loadStatistics();
        });

        function loadAppointments() {
            fetch("/appointments")
                .then(response => response.json())
                .then(data => {
                    let html = "";
                    data.forEach((appointment, index) => {
                        html += `
                            <tr class="table-row" style="animation: slideIn 0.3s ease forwards ${index * 0.1}s;">
                                <td class="border-b border-gray-200 px-4 py-3">${appointment.patient_first_name}</td>
                                <td class="border-b border-gray-200 px-4 py-3">${appointment.appointment_date}</td>
                                <td class="border-b border-gray-200 px-4 py-3">${appointment.start_time} - ${appointment.end_time}</td>
                                <td class="border-b border-gray-200 px-4 py-3">
                                    <span class="px-3 py-1 rounded-full text-sm ${getStatusColor(appointment.status)}">
                                        ${appointment.status}
                                    </span>
                                </td>
                                <td class="border-b border-gray-200 px-4 py-3 space-x-2">
                                    <button onclick="updateAppointment(${appointment.appointment_id}, 'confirmed')" 
                                            class="btn bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded-lg">
                                        Confirm
                                    </button>
                                    <button onclick="updateAppointment(${appointment.appointment_id}, 'cancelled')" 
                                            class="btn bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg">
                                        Cancel
                                    </button>
                                </td>
                            </tr>`;
                    });
                    document.getElementById("appointmentList").innerHTML = html || '<tr><td colspan="5" class="py-4 text-center text-gray-500">No appointments found</td></tr>';
                });
        }

        function getStatusColor(status) {
            const colors = {
                'Confirmed': 'bg-green-100 text-green-800',
                'Cancelled': 'bg-red-100 text-red-800',
                'Pending': 'bg-yellow-100 text-yellow-800',
                'Completed': 'bg-blue-100 text-blue-800'
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        }

        function updateAppointment(id, status) {
            if (confirm(`Are you sure you want to ${status} this appointment?`)) {
                fetch("/doctor/appointment/update", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ appointment_id: id, status: status })
                })
                .then(() => {
                    loadAppointments();
                    showNotification(`Appointment ${status} successfully`);
                });
            }
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                const logoutBtn = document.querySelector('.logout-btn');
                const originalContent = logoutBtn.innerHTML;
                logoutBtn.innerHTML = '<span class="animate-spin">↻</span> Logging out...';
                logoutBtn.disabled = true;

                fetch('/logout', {
                    method: 'POST',
                    credentials: 'include'
                })
                .then(response => {
                    if (response.ok) {
                        showNotification('Logging out...');
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 1000);
                    } else {
                        throw new Error('Logout failed');
                    }
                })
                .catch(error => {
                    showNotification('Logout failed. Please try again.');
                    logoutBtn.innerHTML = originalContent;
                    logoutBtn.disabled = false;
                });
            }
        }

        document.getElementById("availabilityForm").addEventListener("submit", function (e) {
            e.preventDefault();
            let formData = new FormData(this);

            fetch("/doctor/set-availability", {
                method: "POST",
                body: formData
            })
            .then(() => {
                showNotification("Availability updated successfully!");
                this.reset();
            });
        });

        function loadStatistics() {
            fetch("/appointments")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("totalAppointments").innerText = data.length;
                    document.getElementById("totalRevenue").innerText = data.total_revenue || 0;
                });
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg animate-fade-in';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => {
                notification.style.animation = 'fadeIn 0.5s ease reverse';
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
